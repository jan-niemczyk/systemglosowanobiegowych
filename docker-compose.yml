services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgo}
      POSTGRES_USER: ${POSTGRES_USER:-sgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgo_dev_pw}
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    volumes:
      - sgo_db:/var/lib/postgresql/data
    # Port 5432 NIE jest już wystawiany na świat - dostęp tylko z sieci dockera.
    # (Jeśli potrzebujesz łączyć się z bazą z zewnątrz, odkomentuj poniżej.)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgo}:${POSTGRES_PASSWORD:-sgo_dev_pw}@db:5432/${POSTGRES_DB:-sgo}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://mrp.iobrady.pl}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      INIT_SEED: ${INIT_SEED:-false}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operator@sgo.local}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
      NODE_ENV: production
      TZ: Europe/Warsaw
    # Port 3000 NIE jest wystawiany na świat - ruch idzie przez Caddy.
    expose:
      - "3000"
    volumes:
      # Trwałe miejsce na logo organizacji - przetrwa redeploy
      - sgo_uploads:/app/public/uploads
      # Dokumenty spraw - CELOWO poza public/ (sekcja 8: bez publicznego dostępu bez
      # kontroli uprawnień, patrz src/lib/documentStorage.ts i /api/documents/[id]).
      - sgo_documents:/app/storage/documents
    command: >
      sh -c "
        npx prisma db push --accept-data-loss &&
        if [ \"$INIT_SEED\" = \"true\" ]; then npx tsx prisma/seed.ts; fi &&
        node server.js
      "

  # Harmonogram automatycznego zamykania spraw z upłynionym terminem (sekcja 12).
  # Ten sam obraz co `app`, inny punkt wejścia - bez dostępu do dokumentów ani portu HTTP.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgo}:${POSTGRES_PASSWORD:-sgo_dev_pw}@db:5432/${POSTGRES_DB:-sgo}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      # Do budowy linków w e-mailach powiadomień o automatycznym zamknięciu sprawy/publikacji wyników.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://mrp.iobrady.pl}
      NODE_ENV: production
      TZ: Europe/Warsaw
    command: ["npx", "tsx", "scripts/scheduler.ts"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Europe/Warsaw

volumes:
  sgo_db:
  sgo_uploads:
  sgo_documents:
  caddy_data:
  caddy_config:
